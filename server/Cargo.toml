[package]
name = "sudden-front-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
bevy_ecs = "0.18"
futures-util = "0.3"
prost = "0.14"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tower-http = { version = "0.6", features = ["fs"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[profile.release]
opt-level = 3
