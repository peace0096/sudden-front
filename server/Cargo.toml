[package]
name = "sudden-front-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
bevy_ecs = "0.18"
futures-util = "0.3"
prost = "0.14"
# The process collector (CPU, memory, threads) works on Linux only, where the Docker image runs.
prometheus = { version = "0.14", default-features = false, features = ["process"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[profile.release]
opt-level = 3

# Harness rules (server/AGENTS.md): no unsafe code, and integer arithmetic that can overflow must say how
# it handles that (checked_/saturating_/wrapping_, or an #[expect] with the reason it cannot overflow).
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
arithmetic_side_effects = "warn"
